services:
  api:
    build: .
    env_file: .env.example
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: .
    env_file: .env.example
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
  beat:
    build: .
    env_file: .env.example
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cryptosage
      POSTGRES_USER: cryptosage
      POSTGRES_PASSWORD: cryptosage
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptosage -d cryptosage"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  prometheus:
    image: prom/prometheus:v2.53.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    volumes: ["grafana-data:/var/lib/grafana"]
    depends_on: [prometheus]
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
