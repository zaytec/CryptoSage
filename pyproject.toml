[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptosage"
version = "1.0.0"
description = "Production-minded cryptocurrency analytics and intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "email-validator>=2.2,<3.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "celery[redis]>=5.4,<6.0",
  "prometheus-fastapi-instrumentator>=8.0,<9.0",
  "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=5.0,<7.0",
  "pip-audit>=2.10,<3.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
